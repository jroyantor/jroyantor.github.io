---
layout: home
---
<article class="post-detail">
    <header class="post-header">
        <a class="post-back-link" href="{{ site.baseurl }}/#posts"><i class="fas fa-arrow-left"></i> Back to posts</a>
        <p class="post-kicker">Field notes · {{ page.date | date: "%B %d, %Y" }}</p>
        <h1>{{ page.title }}</h1>
        <div class="post-rule"></div>
    </header>
    <div class="post-body">
        {{ content }}
    </div>
</article>
